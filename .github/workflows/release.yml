name: Release

on:
  release:
    types: [published]

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            artifact-name: server-windows-x64.exe
          - arch: arm64
            runner: windows-11-arm
            artifact-name: server-windows-arm64.exe

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Write version info
        run: |
          $short = "${{ github.sha }}".Substring(0, 7)
          Set-Content -Path _version.py -Value "GIT_COMMIT = '$short'" -Encoding UTF8

      - name: Build executable
        run: |
          pyinstaller --onefile --name gbox-gui-server `
            --add-data "_version.py;." `
            --hidden-import _version `
            --hidden-import win32timezone `
            --hidden-import win32serviceutil `
            --hidden-import win32service `
            --hidden-import win32event `
            --hidden-import win32ts `
            --hidden-import win32process `
            --hidden-import win32profile `
            --hidden-import win32security `
            --hidden-import win32con `
            --hidden-import servicemanager `
            --collect-binaries pywin32 `
            server.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: dist/gbox-gui-server.exe

  upload-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp release-artifacts/server-windows-x64.exe/gbox-gui-server.exe release-assets/server-windows-x64.exe
          cp release-artifacts/server-windows-arm64.exe/gbox-gui-server.exe release-assets/server-windows-arm64.exe

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            release-assets/server-windows-x64.exe
            release-assets/server-windows-arm64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
