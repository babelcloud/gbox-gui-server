name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            artifact-name: server-windows-x64.exe
          - arch: arm64
            runner: windows-11-arm
            artifact-name: server-windows-arm64.exe

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --onefile --name gbox-gui-server `
            --hidden-import win32timezone `
            --hidden-import win32serviceutil `
            --hidden-import win32service `
            --hidden-import win32event `
            --hidden-import win32ts `
            --hidden-import win32process `
            --hidden-import win32profile `
            --hidden-import win32security `
            --hidden-import win32con `
            --hidden-import servicemanager `
            --collect-binaries pywin32 `
            server.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: dist/gbox-gui-server.exe
          retention-days: 30
